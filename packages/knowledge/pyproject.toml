[project]
name = "qa-copilot-knowledge"
version = "0.1.0"
description = "Retrieval, embeddings, and project memory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "qa-copilot-domain>=0.1.0",
    "qa-copilot-repository>=0.1.0",
]

[tool.uv.sources]
qa-copilot-domain = { workspace = true }
qa-copilot-repository = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_copilot_knowledge"]
