[project]
name = "qa-copilot-repository"
version = "0.1.0"
description = "Data access (SQLAlchemy models/sessions) + Git, AST, and file indexing"
requires-python = ">=3.11"
dependencies = [
    "qa-copilot-ai>=0.1.0",
    "qa-copilot-domain>=0.1.0",
    "qa-copilot-execution>=0.1.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]

[tool.uv.sources]
qa-copilot-ai = { workspace = true }
qa-copilot-domain = { workspace = true }
qa-copilot-execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_copilot_repository"]
