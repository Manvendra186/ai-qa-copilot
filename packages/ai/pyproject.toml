[project]
name = "qa-copilot-ai"
version = "0.1.0"
description = "LLM gateway, agents, prompts, and schemas (build bible §31.1, §31.6)"
requires-python = ">=3.11"
dependencies = ["qa-copilot-domain>=0.1.0", "httpx>=0.27", "pydantic>=2.7"]

[tool.uv.sources]
qa-copilot-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_copilot_ai"]
